<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>投资智慧知识库</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="段永平 · 巴菲特 · 芒格：995 篇离线全文知识库，支持全文搜索">
<link rel="stylesheet" href="vendor/theme.css">
</head>
<body>
<div id="app">加载中…</div>

<script>
(function () {
  // 深色模式：跟随系统，可手动切换并记忆
  var saved = null;
  try { saved = localStorage.getItem('iw-theme'); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  function apply(mode) {
    document.documentElement.classList.toggle('dark', mode === 'dark');
  }
  apply(saved === 'dark' || (saved !== 'light' && prefersDark));
  window.__iwToggleTheme = function () {
    var dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('iw-theme', dark ? 'dark' : 'light'); } catch (e) {}
  };

  // 移动端预置收起侧栏（docsify 核心不带布局 CSS，close 状态由主题 CSS 控制）
  if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
    document.body.classList.add('close');
  }
})();

window.$docsify = {
  name: '投资智慧知识库',
  loadSidebar: true,
  subMaxLevel: 2,
  auto2top: true,
  coverpage: true,
  onlyCover: true,
  mergeNavbar: true,
  pagination: {
    previousText: '上一篇',
    nextText: '下一篇',
    crossChapter: true
  },
  search: {
    depth: 3,
    noData: { '/': '没有找到相关结果' },
    placeholder: { '/': '搜索全文…' },
    hideOtherSidebarContent: false
  },
  plugins: [
    function (hook) {
      var narrow = function () { return window.innerWidth <= 768; };

      // 遮罩层：移动端侧栏打开时点击关闭
      hook.mounted(function () {
        var backdrop = document.createElement('div');
        backdrop.className = 'sb-backdrop';
        backdrop.addEventListener('click', function (e) {
          e.stopPropagation();
          document.body.classList.add('close');
        });
        document.body.appendChild(backdrop);

        // 阻断 docsify 核心的移动端「点正文开侧栏」行为（点击正文不应弹侧栏）
        var mainEl = document.querySelector('main');
        if (mainEl) {
          mainEl.addEventListener('click', function (e) {
            if (narrow() && document.body.classList.contains('close')) {
              e.stopPropagation();
            }
          }, true);
        }
      });

      // 每次导航后：标记索引页（卡片化）/封面页，移动端自动收起侧栏
      hook.doneEach(function () {
        var h = location.hash;
        var isIndex = h === '#/' || /\/$/.test(h) || /README(\.md)?$/i.test(h);
        document.body.classList.toggle('page-index', isIndex);
        document.body.classList.toggle('show-cover', h === '#/' || h === '#' || h === '');
        if (narrow()) document.body.classList.add('close');
      });
    }
  ]
};
</script>

<script src="vendor/docsify.min.js"></script>
<script src="vendor/search.min.js"></script>
<script src="vendor/docsify-pagination.min.js"></script>

<!-- 悬浮按钮：深色切换 / 回到顶部 -->
<div class="fab-wrap" id="fab-wrap" style="display:none">
  <div class="fab" title="深浅色切换" onclick="window.__iwToggleTheme()">◐</div>
  <div class="fab" title="回到顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>
</div>

<script>
(function () {
  function sync() {
    var w = document.getElementById('fab-wrap');
    if (w) w.style.display = (location.hash === '#/' || location.hash === '#' || location.hash === '') ? 'none' : 'flex';
  }
  window.addEventListener('hashchange', sync);
  window.addEventListener('load', sync);
})();
</script>

</body>
</html>
